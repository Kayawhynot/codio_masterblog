<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Flask Blog</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<h1>Welcome to My Flask Blog!</h1>
<ul>
    {% for post in posts %}
    <li>
        <h2>{{ post['title'] }}</h2>
        <p><em>Written by {{ post['author'] }}</em></p>
        <p>{{ post['content'] }}</p>
        <p><a href="/delete/{{ post['id'] }}">Delete Post </a></p>
        <p><a href="/update/{{ post['id'] }}">Update Post</a></p>
    </li>
    {% endfor %}
</ul>
<p><a href="/add">To add another blog entry click here</a></p>
</body>
</html>
